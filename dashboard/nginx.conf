# ============================================================================
# FuzzStrike Dashboard — Nginx Configuration
# ============================================================================
# Serves the static Glassmorphism dashboard and proxies API requests to
# the C2 orchestrator, eliminating CORS issues entirely.
# ============================================================================

server {
    listen 80;
    server_name localhost;

    # --------------------------------------------------------------------------
    # Static Dashboard Files
    # --------------------------------------------------------------------------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Prevent browser caching of JS/CSS — always serve fresh files.
        # This fixes the issue where Docker serves updated HTML but the
        # browser uses stale JavaScript with old resize logic.
        location ~* \.(js|css)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }
    }

    # --------------------------------------------------------------------------
    # API Reverse Proxy → C2 Orchestrator
    # --------------------------------------------------------------------------
    # All requests to /api/* are forwarded to the FastAPI C2 server.
    # This avoids CORS entirely since the browser sees a same-origin request.
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://c2-orchestrator:9000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts for long-polling scenarios
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    # --------------------------------------------------------------------------
    # Health endpoint proxy
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://c2-orchestrator:9000/health;
    }
}
