; ============================================================================
; FuzzStrike Target Environment — Supervisord Configuration
; ============================================================================
; Manages two processes inside a single Docker container:
;   1. target_server — The intentionally vulnerable TCP server
;   2. agent         — The telemetry/crash monitoring agent
;
; If the target server crashes, supervisord will NOT restart it.
; The agent detects the crash, reports to C2, then exits.
; ============================================================================

[supervisord]
nodaemon=true                    ; Run in foreground (required for Docker)
logfile=/dev/stdout              ; Log to stdout for Docker logging
logfile_maxbytes=0               ; Disable log rotation (Docker handles this)
pidfile=/tmp/supervisord.pid

; ============================================================================
; Process 1: Vulnerable Target TCP Server
; ============================================================================
[program:target_server]
command=python /app/target_server.py
directory=/app
autostart=true
autorestart=false                ; Do NOT restart on crash — we want to detect it
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10                      ; Start first

; ============================================================================
; Process 2: Telemetry Agent
; ============================================================================
[program:agent]
command=python /app/agent.py
directory=/app
autostart=true
autorestart=true                 ; Agent should stay alive to monitor
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20                      ; Start after target server
